    <script>
      // Guard window.fetch with both getter and setter so extension interceptors do not throw "Cannot set property fetch which has only a getter"
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _f;
            },
            set: function(val) {
              _f = val;
            }
          });
        } catch (e) {}
      })();
    </script>
